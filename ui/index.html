<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ELE-TRON</title>
<style>
:root{--gb:28px;--ga:.07;--bgb:0px;--dim:.25;--b:rgba(255,255,255,.14);--t:#f2f4fa;--m:#a3abc4;--a:#7c8cff;color-scheme:dark}
*{box-sizing:border-box;margin:0;font-family:"Segoe UI Variable Text","Segoe UI",system-ui,sans-serif}
html,body{height:100%;overflow:hidden;background:#090b14;color:var(--t)}
#bg{position:fixed;inset:-50px;background:#090b14 center/cover no-repeat;filter:blur(var(--bgb));z-index:0;transition:filter .3s}
#bg::after{content:"";position:absolute;inset:0;background:rgba(0,0,0,var(--dim));transition:background .3s}
.orb{position:absolute;border-radius:50%;filter:blur(90px);opacity:.5;animation:float 20s ease-in-out infinite alternate}
.o1{width:520px;height:520px;background:#5b6cff;top:-100px;left:-60px}
.o2{width:460px;height:460px;background:#ff5fa2;bottom:-120px;right:-40px;animation-delay:-7s}
.o3{width:380px;height:380px;background:#22d3c5;top:42%;left:46%;opacity:.3;animation-delay:-13s}
body.hasbg .orb{display:none}
@keyframes float{to{transform:translate(90px,60px) scale(1.15)}}
.app{position:relative;z-index:1;display:flex;height:100%;gap:var(--gap,14px);padding:var(--gap,14px)}
.glass{background:rgba(255,255,255,var(--ga));border:1px solid var(--b);backdrop-filter:blur(var(--gb)) saturate(170%);-webkit-backdrop-filter:blur(var(--gb)) saturate(170%);border-radius:22px;box-shadow:0 12px 40px rgba(0,0,0,.28);transition:background .3s,border-color .3s,backdrop-filter .3s}
nav{width:210px;padding:16px 10px;display:flex;flex-direction:column;gap:4px;flex:none}
nav h1{font-size:16px;font-weight:600;padding:6px 12px 16px}
nav button{display:flex;gap:10px;align-items:center;background:none;border:0;color:var(--m);font-size:14px;padding:10px 12px;border-radius:12px;cursor:pointer;text-align:left;transition:.2s}
nav button:hover{background:rgba(255,255,255,.08);color:var(--t)}nav button.on{background:rgba(255,255,255,.14);color:var(--t)}
main{flex:1;padding:28px 32px 96px;overflow:auto}
::-webkit-scrollbar{width:8px}::-webkit-scrollbar-thumb{background:rgba(255,255,255,.18);border-radius:8px}
.hero{margin-bottom:26px}.hero h1{font-size:34px;font-weight:600;letter-spacing:-.6px}.hero p{color:var(--m);margin-top:6px}
.head{display:flex;justify-content:space-between;align-items:center;gap:14px;margin-bottom:22px}.head h2{font-size:26px;font-weight:600;letter-spacing:-.4px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:16px}
.tile,.card{position:relative;background:rgba(255,255,255,.07);border:1px solid var(--b);border-radius:20px;padding:20px;display:flex;flex-direction:column;gap:6px;transition:transform .25s cubic-bezier(.2,.8,.2,1),background .25s,border-color .25s}
.tile{height:160px;cursor:pointer;justify-content:flex-end}
.tile:hover,.grid .card:hover{transform:translateY(-4px);background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.28)}
.ic{position:absolute;top:18px;left:18px;width:54px;height:54px;border-radius:16px;display:grid;place-items:center;font-size:26px;background:linear-gradient(135deg,var(--c));box-shadow:0 8px 22px rgba(0,0,0,.35)}
b{font-weight:600}.tile b,.card b{font-size:16px}
small{color:var(--m);font-size:12.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.big{font-size:32px;margin-bottom:6px}
.fade .tile,.fade .card{animation:up .55s cubic-bezier(.16,.84,.2,1) both;animation-delay:calc(var(--i,0)*45ms)}
@keyframes up{from{opacity:0;transform:translateY(16px) scale(.97);filter:blur(4px)}to{filter:blur(0)}}
.row{display:flex;gap:10px;align-items:center;margin-top:10px;flex-wrap:wrap}.grow{flex:1;min-width:120px}
.in{background:rgba(255,255,255,.09);border:1px solid var(--b);color:var(--t);border-radius:12px;padding:10px 12px;font-size:14px;outline:none;transition:.2s}
.in:focus{border-color:var(--a);box-shadow:0 0 0 3px rgba(124,140,255,.25)}select.in option{background:#1a1d2e}
.btn{background:rgba(255,255,255,.11);border:1px solid var(--b);color:var(--t);border-radius:12px;padding:9px 16px;font-size:14px;cursor:pointer;transition:.2s}
.btn:hover{background:rgba(255,255,255,.2)}.btn:active{transform:scale(.96)}
.pri{background:linear-gradient(135deg,#6a7bff,#9b5cff);border:0}.pri:hover{filter:brightness(1.12);background:linear-gradient(135deg,#6a7bff,#9b5cff)}
.dng{color:#ff8095}.chip{padding:8px 14px;border-radius:999px;font-size:13.5px}
.x{position:absolute;top:12px;right:12px;background:none;border:0;color:var(--m);cursor:pointer;font-size:14px;padding:4px 8px;border-radius:8px}.x:hover{background:rgba(255,255,255,.14);color:#ff8095}
.wide{max-width:780px;gap:14px;margin-bottom:16px}
.wide label{display:flex;flex-direction:column;gap:6px;color:var(--m);font-size:13px}
.wide label.sw{flex-direction:row;justify-content:space-between;align-items:center;color:var(--t);font-size:14px}
.wide h3{font-size:15px;font-weight:600}
input[type=checkbox]{appearance:none;width:44px;height:26px;border-radius:13px;background:rgba(255,255,255,.18);position:relative;cursor:pointer;transition:.25s;flex:none}
input[type=checkbox]::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:.25s}
input[type=checkbox]:checked{background:#5b6cff}input[type=checkbox]:checked::after{transform:translateX(18px)}
input[type=range]{accent-color:#7c8cff;width:100%}
.it{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:10px;border-radius:14px;background:rgba(255,255,255,.05)}
.tag{font-size:14px;font-weight:600;min-width:110px}
.note{cursor:pointer;border-left:3px solid var(--nc);box-shadow:0 0 34px -14px var(--nc);min-height:150px}
.pv{max-height:112px;overflow:hidden;color:#cfd5ea;font-size:13px;line-height:1.55;-webkit-mask-image:linear-gradient(#000 65%,transparent);mask-image:linear-gradient(#000 65%,transparent)}
.pin{position:absolute;top:12px;right:14px;font-size:13px}
#ov,#ne{position:fixed;inset:0;display:none;place-items:center;background:rgba(5,6,12,.55);backdrop-filter:blur(10px);z-index:9}
#ov.on,#ne.on{display:grid}
.ned{width:min(780px,92%);height:min(580px,88%);padding:22px;display:flex;flex-direction:column;gap:12px;border-top:3px solid var(--nc);animation:pop .4s cubic-bezier(.2,1.2,.3,1)}
.ned textarea{flex:1;resize:none;line-height:1.65;font-size:15px}.ttl{font-size:21px;font-weight:600}
.nh,.dots{display:flex;gap:10px;align-items:center}
.dots i{width:22px;height:22px;border-radius:50%;background:var(--c);cursor:pointer;transition:.2s;border:2px solid transparent}
.dots i:hover{transform:scale(1.15)}.dots i.on{border-color:#fff}
.pop{padding:32px 40px;display:flex;flex-direction:column;align-items:center;gap:10px;animation:pop .45s cubic-bezier(.2,1.2,.3,1)}
@keyframes pop{from{opacity:0;transform:scale(.9)}}
.num{font-size:84px;font-weight:200;line-height:1;background:linear-gradient(135deg,#8fa0ff,#ff7ab8);-webkit-background-clip:text;background-clip:text;color:transparent}
#toast{position:fixed;bottom:26px;left:50%;transform:translate(-50%,30px);opacity:0;padding:11px 20px;border-radius:14px;font-size:14px;background:rgba(30,33,52,.92);border:1px solid var(--b);transition:.35s cubic-bezier(.2,.9,.25,1);pointer-events:none;z-index:20}
#toast.on{opacity:1;transform:translate(-50%,0)}
:focus-visible{outline:2px solid var(--a);outline-offset:2px}

/* ---- Music widget ---- */
#mp{position:fixed;right:18px;bottom:18px;z-index:16;width:236px;height:60px;border-radius:20px;transform-origin:bottom right;overflow:hidden;background:rgba(255,255,255,var(--ga));border:1px solid var(--b);backdrop-filter:blur(var(--gb)) saturate(170%);-webkit-backdrop-filter:blur(var(--gb)) saturate(170%);box-shadow:0 14px 40px rgba(0,0,0,.32);transition:width .5s cubic-bezier(.16,.9,.2,1),height .5s cubic-bezier(.16,.9,.2,1),border-radius .4s cubic-bezier(.16,.9,.2,1),box-shadow .4s}
#mp.open{width:min(700px,calc(100vw - 36px));height:min(500px,calc(100vh - 36px));border-radius:24px;box-shadow:0 24px 70px rgba(0,0,0,.45)}
#mp .mcompact{position:absolute;inset:0;display:flex;align-items:center;gap:10px;padding:10px 12px;cursor:pointer;opacity:1;transition:opacity .22s}
#mp.open .mcompact{opacity:0;pointer-events:none}
#mp .art{width:38px;height:38px;border-radius:12px;background:linear-gradient(135deg,#3a3f66,#242840);display:grid;place-items:center;font-size:16px;flex:none;background-size:cover;background-position:center}
#mp .meta{overflow:hidden;flex:1;min-width:0}
#mp .meta b{display:block;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#mp .meta small{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#mp .mctl{background:none;border:0;color:var(--t);font-size:15px;cursor:pointer;flex:none;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;transition:.2s}
#mp .mctl:hover{background:rgba(255,255,255,.16)}
#mp .exp{opacity:0;transform:translateX(-3px);transition:.2s;font-size:15px;color:var(--m)}
#mp .mcompact:hover .exp{opacity:1;transform:translateX(0)}
#mp .mexpand{position:absolute;inset:0;display:flex;opacity:0;transition:opacity .28s .16s;pointer-events:none}
#mp.open .mexpand{opacity:1;pointer-events:auto}
#mp .msb{width:78px;flex:none;padding:16px 8px;display:flex;flex-direction:column;gap:6px;align-items:center;border-right:1px solid var(--b)}
#mp .msb button{width:54px;height:52px;border-radius:16px;background:none;border:0;color:var(--m);font-size:19px;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;transition:.2s}
#mp .msb button:hover{background:rgba(255,255,255,.08);color:var(--t)}
#mp .msb button.on{background:rgba(124,140,255,.22);color:#c7cfff}
#mp .msb button small{font-size:9px;color:inherit}
#mp .mcontent{flex:1;display:flex;flex-direction:column;min-width:0}
#mp .mtop{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;flex:none;border-bottom:1px solid var(--b)}
#mp .vtoggle{display:flex;gap:4px;background:rgba(255,255,255,.06);border-radius:10px;padding:3px}
#mp .vtoggle button{background:none;border:0;color:var(--m);width:30px;height:28px;border-radius:8px;cursor:pointer;display:grid;place-items:center;font-size:13px;transition:.2s}
#mp .vtoggle button.on{background:rgba(255,255,255,.18);color:var(--t)}
#mp .mbody{flex:1;min-height:0;overflow:auto}
#mp .mlist{padding:8px 12px 12px}
.trow{display:flex;align-items:center;gap:12px;padding:8px 10px;border-radius:12px;cursor:pointer;transition:.16s}
.trow:hover{background:rgba(255,255,255,.06)}.trow.now{background:rgba(124,140,255,.16)}
.trow .ta{width:36px;height:36px;border-radius:9px;background:linear-gradient(135deg,#3a3f66,#242840);flex:none;background-size:cover;background-position:center;display:grid;place-items:center;font-size:14px}
.trow .ti{flex:1;min-width:0}.trow .ti b{display:block;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.trow .ti small{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:10px;padding:10px 12px 14px}
.tcard{cursor:pointer;text-align:left;color:var(--t);background:rgba(255,255,255,.05);border:1px solid transparent;border-radius:12px;padding:6px;transition:.2s}
.tcard:hover{background:rgba(255,255,255,.1);transform:translateY(-2px)}
.tcard.now{border-color:#8fa0ff}
.tcard .ta{width:100%;aspect-ratio:1;border-radius:9px;background:linear-gradient(135deg,#3a3f66,#242840);margin-bottom:5px;background-size:cover;background-position:center;display:grid;place-items:center;font-size:16px}
.tcard b{display:block;font-size:11.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tcard small{display:block;font-size:10.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mempty{padding:30px 16px;color:var(--m);font-size:13.5px;text-align:center}
.npwrap{display:flex;flex-direction:column;align-items:center;gap:14px;padding:26px 20px 18px;text-align:center}
.npart{width:min(200px,40vh);height:min(200px,40vh);border-radius:18px;background:linear-gradient(135deg,#3a3f66,#242840);background-size:cover;background-position:center;display:grid;place-items:center;font-size:42px;box-shadow:0 18px 40px rgba(0,0,0,.4)}
.npmeta{width:100%}.npmeta b{font-size:18px;display:block}.npmeta small{font-size:13px;display:block;margin-top:4px}
.mbar{height:6px;background:rgba(255,255,255,.14);border-radius:3px;overflow:hidden;flex:1;cursor:pointer;transition:height .15s}
.mbar:hover{height:8px}
.mbar i,.cbar i{display:block;height:100%;background:linear-gradient(90deg,#7c8cff,#ff7ab8);width:0%;transition:width .25s linear}
[data-tip]{position:relative}
.tip{position:absolute;bottom:calc(100% + 9px);left:50%;transform:translateX(-50%) translateY(4px);background:rgba(18,20,32,.96);border:1px solid var(--b);color:var(--t);font-size:11.5px;padding:5px 9px;border-radius:8px;white-space:nowrap;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:30}
.tip.show{opacity:1;transform:translateX(-50%) translateY(0)}
/* marquee */
.mq{display:block;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.mq .mqi{display:inline-block;white-space:nowrap}
.mq.on{text-overflow:clip;-webkit-mask-image:linear-gradient(90deg,transparent 0,#000 8px,#000 calc(100% - 16px),transparent 100%);mask-image:linear-gradient(90deg,transparent 0,#000 8px,#000 calc(100% - 16px),transparent 100%)}
.mq.on .mqi{animation:mqs var(--mqd,10s) linear infinite;will-change:transform}
.mq.hov.on .mqi{animation-play-state:paused}
.trow:hover .mq.hov.on .mqi,.tcard:hover .mq.hov.on .mqi,.trow.now .mq.hov.on .mqi,.tcard.now .mq.hov.on .mqi{animation-play-state:running}
@keyframes mqs{to{transform:translateX(-50%)}}
/* panel body, footer, cards */
#mp .mtt{font-size:15px}
#mp .mh{padding:12px 16px 2px;font-size:11.5px;color:var(--m);letter-spacing:.4px;text-transform:uppercase}
#mp .mnote{padding:4px 16px 14px;font-size:11.5px;color:var(--m);line-height:1.5}
#mp .trow.dim{opacity:.6}
#mp .amcard{display:flex;align-items:center;gap:16px;padding:16px 18px}
#mp .amcard .ta{width:min(116px,22vh);height:min(116px,22vh);flex:none;border-radius:16px;background:linear-gradient(135deg,#3a3f66,#242840);background-size:cover;background-position:center;display:grid;place-items:center;font-size:30px}
#mp .amt{min-width:0;flex:1;display:flex;flex-direction:column;gap:4px}
#mp .amt b{font-size:17px}
#mp .mfoot{flex:none;border-top:1px solid var(--b);padding:8px 14px 10px;display:flex;flex-direction:column;gap:7px;background:rgba(0,0,0,.14)}
#mp .fr{display:flex;align-items:center;gap:10px}
#mp .fr .art{width:34px;height:34px;border-radius:10px}
#mp .fctl{display:flex;gap:2px;flex:none}
#mp .mctl.big{width:36px;height:36px;font-size:16px;background:rgba(255,255,255,.14)}
#mp .ftl{display:flex;align-items:center;gap:8px}
#mp .ftl small{font-variant-numeric:tabular-nums;min-width:34px;text-align:center}
#mp .cbar{position:absolute;left:12px;right:12px;bottom:5px;height:2px;background:rgba(255,255,255,.1);border-radius:2px;overflow:hidden}
/* ---- resize: kill blur/transition mid-drag so the panel repaints instantly, no smear/ghost trail ---- */
body.resizing #mp,body.resizing .glass{transition:none!important}
body.resizing #mp{backdrop-filter:none!important;-webkit-backdrop-filter:none!important;background:rgba(14,16,26,.94)!important}
body.resizing .glass{backdrop-filter:none!important;-webkit-backdrop-filter:none!important;background:rgba(14,16,26,.9)!important}

@media(max-width:1000px){#mp:not(.open){width:176px}#mp:not(.open) .exp{display:none}}
@media(max-width:820px){#mp:not(.open){width:120px}#mp:not(.open) .meta{display:none}}
@media(max-width:620px),(max-height:520px){#mp:not(.open){width:54px;height:54px;border-radius:50%}#mp:not(.open) .mctl,#mp:not(.open) .cbar,#mp:not(.open) .exp{display:none}#mp:not(.open) .mcompact{justify-content:center;padding:0}}
@media(max-width:620px){#mp .msb{width:54px;padding:12px 4px}#mp .msb button{width:44px;height:44px;font-size:16px}#mp .msb button small{display:none}#mp .fctl .mctl:not(.big){display:none}#mp .amcard{padding:12px}}
@media(max-height:520px){main{padding-bottom:76px}#mp .amcard .ta{width:72px;height:72px}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.55}}
.live{animation:pulse 2.2s ease-in-out infinite}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body>
<div id="bg"><div class="orb o1"></div><div class="orb o2"></div><div class="orb o3"></div></div>
<div class="app"><nav class="glass" id="nav"></nav><main class="glass" id="main"></main></div>
<div id="ov"></div><div id="ne"></div><div id="toast"></div>
<div id="mp"><div class="mcompact" id="mcompact" onclick="toggleMusicPanel()"></div><div class="mexpand"><div class="msb" id="msb"></div><div class="mcontent" id="mcontent"><div class="mtop" id="mtop"></div><div class="mbody" id="mbody"></div><div class="mfoot" id="mfoot"></div></div></div></div>
<script>
const inv=(c,a)=>window.pywebview.api[c](a||{});
const $=s=>document.querySelector(s),uid=()=>Math.random().toString(36).slice(2,9);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let S,BG='',DET={},profiles=[],view='home',edit=null,nopen=null,q='',st,tt,timer;
const NAV=[['home','Home','🏠',''],['workspaces','Workspaces','🚀','#ff8a5c,#ff4f81'],['notes','Notes','📝','#ffd45c,#ffa63d'],['apps','Apps','🧩','#a78bfa,#f472b6'],['settings','Settings','⚙️','#94a3b8,#64748b']];
const APPS={chrome:['Chrome','🌐'],discord:['Discord','💬'],steam:['Steam','🎮'],whatsapp:['WhatsApp','🟢'],telegram:['Telegram','✈️'],applemusic:['Apple Music','🎵'],spotify:['Spotify','🎧']};
const NC=['#7c8cff','#ff7ab8','#ffd45c','#34d3c5','#ff8a5c','#a78bfa'];
const seed=()=>({settings:{name:'Dark Defender',autoLaunch:true,delay:5,defaultWs:'w1',autostart:false,trayEnabled:true,musicSource:'mp3',musicView:'list',mp3Folder:'',wavFolder:'',recent:[]},theme:{bgBlur:0,dim:25,gBlur:28,gAlpha:7,fit:'cover',gap:14},workspaces:[{id:'w1',name:'Work',icon:'💼',items:[{kind:'chrome',target:'https://proton.me/mail',profile:'Default'}]}],notes:[],links:[],apps:[]});
const save=()=>{clearTimeout(st);st=setTimeout(()=>inv('save_data',{data:S}),300)};
function toast(m){const t=$('#toast');t.textContent=m||'';t.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('on'),3000)}
const head=(t,a='')=>`<div class="head"><h2>${t}</h2><div class="row" style="margin:0">${a}</div></div>`;
const W=id=>S.workspaces.find(w=>w.id==id),N=id=>S.notes.find(n=>n.id==id);
const wc=b=>b.trim().split(/\s+/).filter(Boolean).length;
const lc=b=>b.replace(/\s/g,'').length;
const cnt=k=>k=='workspaces'?S.workspaces.length:k=='notes'?S.notes.length:S[k].length;
const popts=p=>(profiles.length?profiles:[{dir:'Default',name:'Default'}]).map(x=>`<option value="${esc(x.dir)}" ${x.dir==p?'selected':''}>${esc(x.name||x.dir)}${x.email?' · '+esc(x.email):''}</option>`).join('');

function applyTheme(){const t=S.theme,r=document.documentElement.style;r.setProperty('--gb',t.gBlur+'px');r.setProperty('--ga',t.gAlpha/100);r.setProperty('--bgb',t.bgBlur+'px');r.setProperty('--dim',t.dim/100);r.setProperty('--gap',t.gap+'px');$('#bg').style.backgroundImage=BG?`url(${BG})`:'';$('#bg').style.backgroundSize={cover:'cover',contain:'contain',stretch:'100% 100%',center:'auto'}[t.fit]||'cover';document.body.classList.toggle('hasbg',!!BG)}
const th=(k,v)=>{S.theme[k]=v;applyTheme();save()};
function pickBg(el){const f=el.files[0];if(!f)return;const img=new Image();img.onload=()=>{const k=Math.min(1,1920/img.width),c=document.createElement('canvas');c.width=img.width*k;c.height=img.height*k;c.getContext('2d').drawImage(img,0,0,c.width,c.height);BG=c.toDataURL('image/jpeg',.86);inv('save_bg',{data:BG});applyTheme();toast('Background updated')};img.src=URL.createObjectURL(f)}

/* ================= Music system ================= */
const MNAV=[['mp3','MP3','🎵'],['wav','WAV','🎶'],['applemusic','Apple Music','🍎'],['spotify','Spotify','🎧']];
const isLive=k=>k==='applemusic'||k==='spotify';
let MLIB={mp3:null,wav:null},MEXTRA={mutagen:false,smtc:false,tray:false};
const AM0=()=>({title:'',artist:'',album:'',art:null,artkey:'',playing:false,position:0,duration:0,_t:performance.now()});
let AM=AM0(),mplaying=false,mqueue=[],mIdx=-1,mqKind='',amTimer=null,amBusy=false,mopen=false,lastRec='',mnow=false;
let _ch='',_th='',_bh='',_fh='',artObs=null;
const player=new Audio();
let mLoading=false,mSkipStreak=0;
player.addEventListener('ended',()=>musicNext());
player.addEventListener('canplay',()=>{mSkipStreak=0});
player.addEventListener('error',()=>{if(mLoading)return;/* real mid-playback error, not a load we already handled */
 mSkipStreak++;if(mSkipStreak>=Math.max(1,(MLIB[mqKind]||[]).length)){toast('None of the files in this folder could be played.');player.pause();mSkipStreak=0;refreshUI();return}
 if(curTrack())toast('Could not play "'+(curTrack().title||'this track')+'"');musicNext()});
player.addEventListener('play',()=>{mplaying=true;refreshUI()});
player.addEventListener('pause',()=>{mplaying=false;refreshUI()});
const refreshUI=()=>{renderWidget();renderFoot();if(mopen)renderPanel()};

function fileUrl(p){return 'file:///'+encodeURI(p.replace(/\\/g,'/')).replace(/#/g,'%23').replace(/\?/g,'%3F')}
function curTrack(){const lib=MLIB[mqKind];return mIdx>=0&&Array.isArray(lib)?lib[mIdx]:null}
function fmtT(s){s=Math.max(0,Math.round(s||0));return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')}
const artStyle=a=>a?`background-image:url(${a})`:'';

/* ---- marquee: long titles loop smoothly inside their own box ---- */
const GAP='\u2003\u2003\u2003';
const mq=(t,tag='b',hov=0)=>`<${tag} class="mq${hov?' hov':''}" data-t="${esc(t)}"><span class="mqi">${esc(t)}</span></${tag}>`;
function mqMeasure(m){const i=m.firstElementChild,t=m.dataset.t||'',w=m.clientWidth;if(!i||!w)return;
 const k=w+'|'+t;if(m._k===k)return;m._k=k;m.classList.remove('on');i.textContent=t;
 if(i.offsetWidth>w+1){i.textContent=t+GAP+t+GAP;m.style.setProperty('--mqd',Math.max(6,i.offsetWidth/2/42).toFixed(1)+'s');m.classList.add('on')}}
function initMarquee(root){(root||document).querySelectorAll('.mq').forEach(m=>{if(m.classList.contains('hov')&&!m.closest('.now'))return;mqMeasure(m)})}

/* ---- what is audible / shown right now ---- */
const useLocal=()=>!isLive(S.settings.musicSource)||mplaying;
function nowInfo(){
 if(useLocal()){const t=curTrack()||{};return{title:t.title||'Nothing playing',artist:t.artist||(t.title?'':(S.settings.musicSource||'').toUpperCase()+' library'),art:t._art||null,playing:mplaying,pos:player.currentTime||0,dur:isFinite(player.duration)?player.duration:(t.duration||0),live:false}}
 const nm=MNAV.find(n=>n[0]===S.settings.musicSource)[1],el=AM.playing?(performance.now()-AM._t)/1000:0;
 let pos=AM.position+el;if(AM.duration)pos=Math.min(pos,AM.duration);
 return{title:AM.title||nm,artist:AM.artist||'',art:AM.art,playing:AM.playing,pos,dur:AM.duration,live:true}}

/* ---- real-time timeline (runs 4x per second, independent of polling) ---- */
function tick(){if(!S)return;const n=nowInfo(),pct=n.dur?Math.min(100,n.pos/n.dur*100):0;
 document.querySelectorAll('.pbar i').forEach(b=>b.style.width=pct+'%');
 const c=fmtT(n.pos),d=n.dur?fmtT(n.dur):'--:--';
 document.querySelectorAll('.tcur').forEach(e=>{if(e.textContent!==c)e.textContent=c});
 document.querySelectorAll('.tdur').forEach(e=>{if(e.textContent!==d)e.textContent=d})}

/* ---- library ---- */
async function chooseFolder(kind){const p=await inv('pick',{folder:true});if(!p)return;S.settings[kind+'Folder']=p;save();MLIB[kind]=null;if(mopen)renderPanel();if(view=='settings')render(1)}
async function loadLib(kind){if(MLIB[kind]==='loading')return;const folder=S.settings[kind+'Folder'];
 if(!folder){MLIB[kind]=[];if(mopen)renderPanel();return}
 MLIB[kind]='loading';if(mopen)renderPanel();
 const r=await inv('music_scan',{folder,kind});MLIB[kind]=(r||[]).map((t,i)=>(t._id=kind+':'+i,t));if(mopen)renderPanel()}
async function ensureArt(t){if(!t||typeof t!=='object'||t._art!==undefined)return;t._art=null;const url=await inv('music_artwork',{path:t.path});t._art=url||null;if(!t._art)return;paintArt(t);if(curTrack()===t){renderWidget();renderFoot()}}
function paintArt(t){document.querySelectorAll('[data-id="'+t._id+'"] .ta').forEach(e=>{e.style.backgroundImage='url('+t._art+')';e.textContent=''})}
function observeArt(){if(!('IntersectionObserver' in window))return;const b=$('#mbody');
 if(!artObs)artObs=new IntersectionObserver(es=>es.forEach(e=>{if(!e.isIntersecting)return;artObs.unobserve(e.target);const[k,i]=(e.target.dataset.id||':').split(':'),lib=MLIB[k];if(Array.isArray(lib))ensureArt(lib[+i])}),{root:b,rootMargin:'160px'});
 artObs.disconnect();b.querySelectorAll('[data-id]').forEach(el=>artObs.observe(el))}

/* ---- transport ---- */
function selectSource(src){if(isLive(src)&&mplaying){player.pause();mplaying=false}/* stop local audio so its state can't leak into a live tab; pause() fires its event async, so flip the flag now too */
 S.settings.musicSource=src;save();AM=AM0();_bh='';mnow=false;const b=$('#mbody');if(b)b.scrollTop=0;
 if(isLive(src))startAMPoll();else{stopAMPoll();if(MLIB[src]==null)loadLib(src)}
 renderSidebar();renderPanel();renderWidget();renderFoot()}
function setView(v){S.settings.musicView=v;save();renderPanel()}
async function playAt(kind,i){const lib=MLIB[kind];if(!Array.isArray(lib)||!lib[i])return;mqueue=lib;mqKind=kind;mIdx=i;const t=lib[i];
 mnow=true;mLoading=true;player.pause();refreshUI();
 const src=await inv('music_stream',{path:t.path});
 if(mqKind!==kind||mIdx!==i)return;/* user already moved on while this was loading */
 mLoading=false;
 if(!src){mSkipStreak++;if(mSkipStreak>=lib.length){toast('None of the files in this folder could be played.');mSkipStreak=0;refreshUI();return}
  toast('Could not read "'+(t.title||'this track')+'"');musicNext();return}
 mSkipStreak=0;player.src=src;player.currentTime=0;player.play()?.catch?.(()=>{});ensureArt(t);refreshUI()}
function musicNext(){if(useLocal()){const lib=MLIB[mqKind];if(mIdx<0||!Array.isArray(lib)||!lib.length)return;
  playAt(mqKind,lib.length<=1?0:(mIdx+1)%lib.length)}else amCtl('next')}
function musicPrev(){if(useLocal()){const lib=MLIB[mqKind];if(mIdx<0||!Array.isArray(lib)||!lib.length)return;
  playAt(mqKind,lib.length<=1?0:(mIdx-1+lib.length)%lib.length)}else amCtl('prev')}
function backToList(){mnow=false;renderPanel()}
function togglePlay(){if(useLocal()){if(!curTrack())return;player.paused?player.play()?.catch?.(()=>{}):player.pause()}else amCtl('playpause')}
function seekBar(e,el){const n=nowInfo();if(!n.dur)return;const r=el.getBoundingClientRect(),p=Math.min(1,Math.max(0,(e.clientX-r.left)/r.width))*n.dur;
 if(n.live){AM.position=p;AM._t=performance.now();inv('music_control',{action:'seek',source:S.settings.musicSource,pos:p});tick()}else player.currentTime=p}

/* ---- live sources (Apple Music / Spotify) ---- */
function recordRecent(d){const k=d.title+'|'+d.artist;if(k===lastRec)return;lastRec=k;
 let r=(S.settings.recent||[]).filter(x=>!(x.title===d.title&&x.artist===d.artist));r.unshift({title:d.title,artist:d.artist||'',album:d.album||'',src:S.settings.musicSource,ts:Date.now()});S.settings.recent=r.slice(0,30);save()}
async function amTick(){if(amBusy||document.hidden)return;const src=S.settings.musicSource;if(!isLive(src))return;amBusy=true;
 try{const d=await inv('music_now_playing',{source:src,artkey:AM.artkey||''});if(S.settings.musicSource!==src)return;
  const na=AM0();if(d){Object.assign(na,d);if(d.artkey&&d.artkey===AM.artkey&&!d.art)na.art=AM.art}
  const ch=na.title!==AM.title||na.artist!==AM.artist||na.art!==AM.art||na.playing!==AM.playing;
  AM=na;if(d&&d.title)recordRecent(d);if(ch)refreshUI();tick()}
 catch(e){}finally{amBusy=false}}
async function startAMPoll(){stopAMPoll();await amTick();amTimer=setInterval(amTick,2000)}
function stopAMPoll(){clearInterval(amTimer);amTimer=null}
function amCtl(action){const src=S.settings.musicSource;
 if(action==='playpause'||action==='pause'){const p=nowInfo().pos;AM.playing=action==='pause'?false:!AM.playing;AM.position=p;AM._t=performance.now();renderWidget();renderFoot()}
 inv('music_control',{action,source:src});setTimeout(amTick,400)}
function refreshMusic(){if(!S)return;if(isLive(S.settings.musicSource))amTick();tick()}

/* ---- recently played + local fallback (streams cannot be played outside their app) ---- */
const nrm=s=>String(s||'').toLowerCase().normalize('NFKD').replace(/[^\p{L}\p{N}]+/gu,'');
function findLocal(r){const T=nrm(r.title),A=nrm(r.artist);if(!T)return null;let best=null;
 for(const k of ['mp3','wav']){const lib=MLIB[k];if(!Array.isArray(lib))continue;
  for(let i=0;i<lib.length;i++){const tt=nrm(lib[i].title),ta=nrm(lib[i].artist);
   const near=tt===T||(tt.length>3&&(tt.includes(T)||T.includes(tt))&&Math.abs(tt.length-T.length)<8);if(!near)continue;
   if(A&&ta&&!ta.includes(A)&&!A.includes(ta))continue;if(tt===T)return{kind:k,i};best=best||{kind:k,i}}}
 return best}
function playRecent(idx){const r=(S.settings.recent||[])[idx];if(!r)return;const m=findLocal(r);if(!m)return toast('Not in your local MP3/WAV library');
 if(AM.playing)amCtl('pause');selectSource(m.kind);playAt(m.kind,m.i)}
function recentHtml(){const R=S.settings.recent||[];if(!R.length)return '';
 return '<div class="mh">Recently played</div><div class="mlist">'+R.map((r,i)=>{const m=findLocal(r);return `<div class="trow ${m?'':'dim'}" onclick="playRecent(${i})"><div class="ta">🎵</div><div class="ti">${mq(r.title,'b',1)}<small>${esc(r.artist||'')}</small></div><small>${m?'▶ Local':'Stream only'}</small></div>`}).join('')+'</div><div class="mnote">Streaming tracks only play inside their own app. If a song also exists in your MP3/WAV folders, it plays from there.</div>'}

/* ---- tooltips ---- */
let tipTimer=null;
function initTooltips(){
 document.addEventListener('mouseover',e=>{const el=e.target.closest('[data-tip]');if(!el||el._activeTip)return;clearTimeout(tipTimer);tipTimer=setTimeout(()=>{const t=document.createElement('span');t.className='tip';t.textContent=el.dataset.tip;el.appendChild(t);el._activeTip=t;requestAnimationFrame(()=>t.classList.add('show'))},3000)});
 document.addEventListener('mouseout',e=>{const el=e.target.closest('[data-tip]');if(!el)return;const rel=e.relatedTarget;if(rel&&el.contains(rel))return;clearTimeout(tipTimer);if(el._activeTip){el._activeTip.remove();el._activeTip=null}});
}

/* ---- rendering ---- */
function compactHtml(){const n=nowInfo();
 return `<div class="art" style="${artStyle(n.art)}">${n.art?'':'🎵'}</div>
 <div class="meta">${mq(n.title)}${mq(n.artist,'small')}</div>
 <button class="mctl" onclick="event.stopPropagation();togglePlay()">${n.playing?'⏸':'▶'}</button>
 <span class="exp">⤢</span><div class="cbar pbar"><i></i></div>`}
function renderWidget(){const c=$('#mcompact');if(!c)return;const h=compactHtml();if(h===_ch)return;c.innerHTML=h;_ch=h;initMarquee(c);tick()}

const sidebarHtml=()=>MNAV.filter(([k])=>!isLive(k)||DET[k]).map(([k,label,ic])=>`<button class="${S.settings.musicSource===k?'on':''}" data-tip="${label}" onclick="selectSource('${k}')">${ic}<small>${label}</small></button>`).join('');
function renderSidebar(){const s=$('#msb');if(s)s.innerHTML=sidebarHtml()}
const viewToggleHtml=()=>`<div class="vtoggle"><button class="${S.settings.musicView==='list'?'on':''}" data-tip="List View" onclick="setView('list')">☰</button><button class="${S.settings.musicView==='icon'?'on':''}" data-tip="Icon View" onclick="setView('icon')">▦</button></div>`;

function libRows(kind){const lib=MLIB[kind];
 if(lib==null||lib==='loading')return '<div class="mempty">Scanning your library…</div>';
 if(!lib.length)return `<div class="mempty">No ${kind.toUpperCase()} files yet.<br><button class="btn" style="margin-top:10px" onclick="chooseFolder('${kind}')">Choose ${kind.toUpperCase()} folder</button></div>`;
 const now=i=>mqKind===kind&&mIdx===i?'now':'';
 if(S.settings.musicView==='list')
  return '<div class="mlist">'+lib.map((t,i)=>`<div class="trow ${now(i)}" data-id="${t._id}" onclick="playAt('${kind}',${i})"><div class="ta" style="${artStyle(t._art)}">${t._art?'':'🎵'}</div><div class="ti">${mq(t.title,'b',1)}<small>${esc(t.artist||t.album||'')}</small></div><small>${t.duration?fmtT(t.duration):''}</small></div>`).join('')+'</div>';
 return '<div class="tgrid">'+lib.map((t,i)=>`<button class="tcard ${now(i)}" data-id="${t._id}" onclick="playAt('${kind}',${i})"><div class="ta" style="${artStyle(t._art)}">${t._art?'':'🎵'}</div>${mq(t.title,'b',1)}<small>${esc(t.artist||'')}</small></button>`).join('')+'</div>'}

function nowPlayingHtml(){const t=curTrack();if(!t)return '<div class="mempty">Nothing playing.</div>';const n=nowInfo();
 return `<div class="npwrap"><div class="npart" style="${artStyle(n.art)}">${n.art?'':'🎵'}</div>
 <div class="npmeta">${mq(n.title,'b')}${mq(mLoading?'Loading…':(n.artist||'Unknown artist'),'small')}</div>
 <div class="ftl" style="padding:0 10px;width:100%"><small class="tcur">0:00</small><div class="mbar pbar" onclick="seekBar(event,this)"><i></i></div><small class="tdur">--:--</small></div>
 <div class="fctl" style="justify-content:center;gap:18px;margin-top:4px"><button class="mctl" data-tip="Previous" onclick="musicPrev()">⏮</button><button class="mctl big" onclick="togglePlay()">${mLoading?'⏳':(n.playing?'⏸':'▶')}</button><button class="mctl" data-tip="Next" onclick="musicNext()">⏭</button></div></div>`}
function amHtml(){const src=S.settings.musicSource,m=MNAV.find(n=>n[0]===src),nm=m[1],ic=m[2];
 const ob=`<button class="btn" style="margin-top:10px" onclick="inv('launch',{items:[{kind:'app',app:'${src}'}]})">Open ${nm}</button>`;
 if(!MEXTRA.smtc)return `<div class="mempty">Live ${nm} sync needs the Windows media package.<br><small>pip install -r requirements.txt</small><br>${ob}</div>`;
 const head=AM.title?`<div class="amcard"><div class="ta ${AM.playing?'live':''}" style="${artStyle(AM.art)}">${AM.art?'':ic}</div><div class="amt">${mq(AM.title)}${mq(AM.artist+(AM.album?' · '+AM.album:''),'small')}</div></div>`
  :`<div class="mempty">Nothing playing in ${nm} right now.<br>${ob}</div>`;
 return head+recentHtml()}

function setBody(h){const b=$('#mbody');if(!b||h===_bh)return;const st=b.scrollTop;b.innerHTML=h;b.scrollTop=st;_bh=h;initMarquee(b);observeArt()}
function renderPanel(){const top=$('#mtop');if(!top)return;const src=S.settings.musicSource,m=MNAV.find(n=>n[0]===src);
 const showNow=!isLive(src)&&mnow&&curTrack();
 const th=showNow?`<button class="mctl" data-tip="Back to library" onclick="backToList()">←</button><b class="mtt">Now Playing</b><div class="row" style="margin:0"><button class="mctl" data-tip="Collapse" onclick="toggleMusicPanel()">⤡</button></div>`
  :`<b class="mtt">${m[2]} ${m[1]}</b><div class="row" style="margin:0">${isLive(src)?'':viewToggleHtml()}<button class="mctl" data-tip="Collapse" onclick="toggleMusicPanel()">⤡</button></div>`;
 if(th!==_th){top.innerHTML=th;_th=th}
 setBody(showNow?nowPlayingHtml():(isLive(src)?amHtml():libRows(src)));
 if(!isLive(src)&&MLIB[src]==null)loadLib(src);
 if(isLive(src)&&(S.settings.recent||[]).length)['mp3','wav'].forEach(k=>{if(MLIB[k]==null)setTimeout(()=>loadLib(k),0)})}

function renderFoot(){const f=$('#mfoot');if(!f)return;const n=nowInfo();
 const h=`<div class="fr"><div class="art" style="${artStyle(n.art)}">${n.art?'':'🎵'}</div><div class="meta">${mq(n.title)}${mq(n.artist,'small')}</div>
 <div class="fctl"><button class="mctl" data-tip="Previous" onclick="musicPrev()">⏮</button><button class="mctl big" onclick="togglePlay()">${n.playing?'⏸':'▶'}</button><button class="mctl" data-tip="Next" onclick="musicNext()">⏭</button></div></div>
 <div class="ftl"><small class="tcur">0:00</small><div class="mbar pbar" onclick="seekBar(event,this)"><i></i></div><small class="tdur">--:--</small></div>`;
 if(h===_fh)return;f.innerHTML=h;_fh=h;initMarquee(f);tick()}

function toggleMusicPanel(){mopen=!mopen;$('#mp').classList.toggle('open',mopen);if(mopen){renderSidebar();renderPanel();renderFoot();setTimeout(()=>initMarquee($('#mp')),650)}}

function initMusicUI(){
 setInterval(tick,250);
 const mp=$('#mp');let rt;if('ResizeObserver' in window)new ResizeObserver(()=>{clearTimeout(rt);rt=setTimeout(()=>initMarquee(mp),120)}).observe(mp);
 let winRt;window.addEventListener('resize',()=>{document.body.classList.add('resizing');clearTimeout(winRt);winRt=setTimeout(()=>document.body.classList.remove('resizing'),180)});
 document.addEventListener('mouseover',e=>{const r=e.target.closest&&e.target.closest('.trow,.tcard');if(r)r.querySelectorAll('.mq.hov').forEach(mqMeasure)});
 document.addEventListener('visibilitychange',()=>{if(!document.hidden)refreshMusic()});
 window.addEventListener('focus',refreshMusic);window.onAppShown=refreshMusic}

window.addEventListener('pywebviewready',async()=>{
 const d=seed();S=(await inv('load_data'))||d;S.settings={...d.settings,...S.settings};S.theme={...d.theme,...S.theme};
 ['workspaces','notes','links','apps'].forEach(k=>S[k]=S[k]||[]);
 S.notes.forEach(n=>{n.color=n.color||NC[0];n.pin=!!n.pin;n.ts=n.ts||Date.now();n.body=n.body||'';n.title=n.title||''});
 [BG,profiles,DET]=await Promise.all([inv('load_bg'),inv('chrome_profiles'),inv('detect_apps')]);
 MEXTRA=(await inv('has_music_extras'))||MEXTRA;
 if(isLive(S.settings.musicSource)&&!DET[S.settings.musicSource])S.settings.musicSource='mp3';
 BG=BG||'';applyTheme();render(1);
 initTooltips();initMusicUI();renderWidget();renderFoot();
 inv('set_tray_pref',{on:!!S.settings.trayEnabled});
 if(isLive(S.settings.musicSource))startAMPoll();
 if(await inv('is_autostart')&&S.settings.autoLaunch&&S.workspaces.length)countdown();
});
</script></body></html>
